name: Sentinel Arsenal
on: [push]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Security Scans
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect --source="/path" --report-format json --report-path l.json || echo "[]" > l.json
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep scan --json > s.json || echo "{"results":[]}" > s.json
          docker run --rm -v $(pwd):/root/.cache/ aquasec/trivy fs / --format json > t.json || echo "{"Results":[]}" > t.json
          echo "{"site":[]}" > z.json
      - name: Ship
        run: |
          PAYLOAD=$(jq -n --arg repo_name "RBS3/loginsignup" --arg token "a534f1d8-5354-4097-b1ee-b3f8e38e45d6" --arg version "${{GITHUB_SHA}}" --arg timestamp "$(date +%s)" --argjson s "$(cat s.json)" --argjson t "$(cat t.json)" --argjson l "$(cat l.json)" --argjson z "$(cat z.json)" '$ARGS.named')
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "eee2a29a0399484694fa62d876909f87013519b12e2c9416646c04f8d7d761f1" | sed 's/.* //')
          curl -X POST "https://itchy-pens-grow.loca.lt/upload-intelligence" -H "X-Sentinel-Token: a534f1d8-5354-4097-b1ee-b3f8e38e45d6" -H "X-Sentinel-Signature: $SIG" -H "Content-Type: application/json" -H "bypass-tunnel-reminder: true" -d "$PAYLOAD"
