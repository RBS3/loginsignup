name: Sentinel Arsenal
on: [push]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - name: Static Analysis
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep scan --json > semgrep.json || echo "[]" > semgrep.json
          docker run --rm -v $(pwd):/root/.cache/ aquasec/trivy fs / --format json > trivy.json || echo '{"results":[]}' > trivy.json
      - name: Skip DAST
        run: echo '{"site":[]}' > zap.json
      - name: Ship Intelligence
        run: |
          PAYLOAD=$(jq -n --arg r "RBS3/loginsignup" --arg v_id "${GITHUB_SHA}" --argjson s "$(cat semgrep.json)" --argjson t "$(cat trivy.json)" --argjson z "$(cat zap.json)" '$ARGS.named')
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "99b040c02e91b062063341a5293f6ed20a14802d1fca5a70a88a24c9d3a3d5c4" | sed 's/.* //')
          curl -X POST "https://sheer-murphy-informed-spectacular.trycloudflare.com/upload-intelligence" -H "X-Sentinel-Token: 03e1b7aa-8157-4b92-b5e5-ecb70cc9d948" -H "X-Sentinel-Signature: $SIG" -H "Content-Type: application/json" -d "$PAYLOAD"
